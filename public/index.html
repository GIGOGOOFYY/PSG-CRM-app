<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PSG CRM — Pakistan Safety Glass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
/* ── Reset & Base ── */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:#f0f2f5;color:#1a2332;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:14px;line-height:1.5}
h1,h2,h3,h4,.logo,.brand-dot,.mark,.kt-val{font-family:'Poppins','Inter',sans-serif}
h2,h3,h4{letter-spacing:-.01em}
a{color:#1f7a4d}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
.hidden{display:none!important}

/* CSS custom properties */
:root{
  --sb:#1a2332; --sb-h:#253044; --sb-act:#253044; --sb-bar:#4caf89;
  --sb-t:#9aacbe; --sb-ta:#e8f0f8; --sb-sec:#5a7089; --sbw:220px;
  --top:48px; --bg:#f0f2f5; --panel:#fff; --panel2:#f8f9fa;
  --line:#e8ecf0; --text:#1a2332; --muted:#6b7a8d;
  --accent:#1f7a4d; --accent2:#7ab63f;
  --green:#1f9d5b; --amber:#d69b18; --danger:#e5484d; --blue:#2196f3;
  --sh:0 1px 3px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.05);
  --r:10px;
}
[data-theme=dark]{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2128; --line:#30363d;
  --text:#e6edf3; --muted:#8b949e;
  --sh:0 1px 3px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.2);
}

/* ── LOGIN ── */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#1a2332 0%,#1f7a4d 55%,#7ab63f 100%);z-index:100}
.lcard{background:#fff;width:380px;max-width:94vw;border-radius:18px;
  padding:36px 32px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.lcard .brand-row{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.brand-dot{width:44px;height:44px;border-radius:11px;flex-shrink:0;
  background:linear-gradient(135deg,#1f7a4d,#7ab63f);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px}
.lcard h1{font-size:20px;font-weight:700;color:#1a2332;margin-bottom:1px}
.lcard .lsub{font-size:11.5px;color:#6b7a8d}
.lf{margin-bottom:14px}
.lf label{display:block;font-size:11.5px;font-weight:600;color:#6b7a8d;margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.lf input{display:block;width:100%;padding:10px 14px;border:1.5px solid #e8ecf0;
  border-radius:8px;background:#f8f9fa;color:#1a2332;font-size:14px;transition:border .15s}
.lf input:focus{outline:none;border-color:#1f7a4d;background:#fff}
.lbtn{width:100%;margin-top:6px;padding:12px;border:0;border-radius:9px;
  background:linear-gradient(135deg,#1f7a4d,#7ab63f);color:#fff;
  font-weight:600;font-size:14px;transition:opacity .15s}
.lbtn:hover{opacity:.9}
.lerr{color:#e5484d;font-size:12px;margin-top:10px;min-height:16px}

/* ── APP SHELL ── */
#app{display:flex;height:100vh;overflow:hidden}

/* ── SIDEBAR ── */
#sidebarWrap{width:var(--sbw);background:var(--sb);display:flex;flex-direction:column;
  flex-shrink:0;height:100vh;transition:width .2s,transform .25s ease}

.sb-header{padding:14px 14px 10px;border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0}
.sb-logo{display:flex;align-items:center;gap:10px}
.sb-logo .mark{width:32px;height:32px;border-radius:8px;flex-shrink:0;
  background:linear-gradient(135deg,#1f7a4d,#7ab63f);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px}
.sb-logo .ln{color:#e8f0f8;font-size:13px;font-weight:700;line-height:1.2}
.sb-logo .ls{color:var(--sb-sec);font-size:10px;margin-top:1px}

.sb-conn-row{padding:5px 14px;font-size:11px;color:var(--sb-sec);display:flex;align-items:center;gap:6px;flex-shrink:0}
.cdot{width:7px;height:7px;border-radius:50%;background:#4caf89;flex-shrink:0}
.cdot.off{background:#f44336}

.sb-search-wrap{padding:7px 10px;border-bottom:1px solid rgba(255,255,255,.05);flex-shrink:0}
.sb-search-wrap .si{position:relative}
.sb-search-wrap input{width:100%;padding:7px 10px 7px 28px;
  border:1px solid rgba(255,255,255,.1);border-radius:7px;
  background:rgba(255,255,255,.07);color:#c8d8e8;font-size:12px}
.sb-search-wrap input::placeholder{color:var(--sb-sec)}
.sb-search-wrap input:focus{outline:none;border-color:rgba(76,175,137,.4);background:rgba(255,255,255,.1)}
.sb-search-wrap .sico{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--sb-sec);pointer-events:none}

nav#sidebar{flex:1;overflow-y:auto;padding:8px 0;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.1) transparent}
nav#sidebar::-webkit-scrollbar{width:3px}
nav#sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}

.sb-item{display:flex;align-items:center;gap:9px;width:100%;padding:8px 14px;
  border:0;border-left:3px solid transparent;background:transparent;
  color:var(--sb-t);font-size:12.5px;text-align:left;transition:background .12s,color .12s}
.sb-item:hover{background:var(--sb-h);color:var(--sb-ta)}
.sb-item.active{background:var(--sb-act);color:var(--sb-ta);border-left-color:var(--sb-bar);font-weight:500}
.sb-item svg{flex-shrink:0;opacity:.75}
.sb-item.active svg{opacity:1}

.sb-section{margin-top:4px}
.sb-sec-hdr{display:flex;align-items:center;justify-content:space-between;
  width:100%;padding:5px 14px 3px;border:0;background:transparent;
  color:var(--sb-sec);font-size:10px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;cursor:pointer;transition:color .12s}
.sb-sec-hdr:hover,.sb-sec-hdr.has-active{color:var(--sb-ta)}
.sb-sec-label{flex:1;text-align:left}

.sb-footer{padding:10px 12px;border-top:1px solid rgba(255,255,255,.06);
  display:flex;align-items:center;gap:8px;flex-shrink:0}
.sb-av{width:30px;height:30px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,#1f7a4d,#7ab63f);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px}
.sb-uinfo{flex:1;min-width:0}
.sb-who{color:#e8f0f8;font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-role{font-size:10px;color:var(--sb-sec);margin-top:1px}
.sb-btns{display:flex;gap:3px}
.sb-ib{padding:5px;border:0;background:transparent;color:var(--sb-sec);
  border-radius:6px;display:flex;align-items:center;transition:background .12s}
.sb-ib:hover{background:rgba(255,255,255,.1);color:#e8f0f8}

/* ── MAIN AREA ── */
#mainArea{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:var(--top);background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding:0 20px;flex-shrink:0}
.tb-title{font-size:14px;font-weight:600;color:var(--text);flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-right{display:flex;align-items:center;gap:8px}
.hamburger-btn{display:none;background:none;border:none;cursor:pointer;padding:6px;
  color:var(--text);flex-shrink:0}
.sb-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:150}
.conn-badge{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);
  padding:4px 10px;background:var(--panel2);border-radius:20px;border:1px solid var(--line)}
.conn-badge .cdot{background:#4caf89}
.offline-banner{background:rgba(214,155,24,.12);color:#d69b18;border-bottom:1px solid rgba(214,155,24,.3);padding:8px 24px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.role{display:inline-block;padding:2px 8px;border-radius:12px;font-size:10.5px;font-weight:600;
  background:rgba(122,182,63,.15);color:#7ab63f;border:1px solid rgba(122,182,63,.25)}
.role.emp{background:rgba(33,150,243,.1);color:#2196f3;border-color:rgba(33,150,243,.25)}
#who{font-size:12.5px;font-weight:500;color:var(--muted)}
#view{flex:1;overflow-y:auto;padding:20px 24px;background:var(--bg)}

/* ── PAGE HEADER (pagehead) ── */
.pagehead{display:flex;align-items:flex-start;justify-content:space-between;
  margin-bottom:18px;gap:16px;flex-wrap:wrap}
.pagehead h2{font-size:20px;font-weight:700;color:var(--text);margin-bottom:2px}
.pagehead .sub{font-size:12.5px;color:var(--muted)}
.pagehead .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex-shrink:0}
.pagehead .search input{padding:8px 12px 8px 12px;border:1.5px solid var(--line);
  border-radius:8px;background:var(--panel);color:var(--text);font-size:13px;width:220px;
  transition:border .15s}
.pagehead .search input:focus{outline:none;border-color:var(--accent)}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;
  font-size:13px;font-weight:500;border:0;cursor:pointer;transition:opacity .15s,background .15s;line-height:1}
.btn:hover{opacity:.88}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:var(--panel2);color:var(--text);border:1.5px solid var(--line)}
.btn.ghost:hover{background:var(--line)}
.btn.ghost.danger{color:var(--danger);border-color:var(--danger)}
.btn.ghost.danger:hover{background:rgba(229,72,77,.07)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.sm.ghost{padding:5px 10px}

/* ── CARD ── */
.card{background:var(--panel);border-radius:var(--r);border:1px solid var(--line);
  box-shadow:var(--sh);margin-bottom:16px;overflow:hidden}
.card h3{font-size:13.5px;font-weight:600;padding:14px 18px;border-bottom:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}

/* ── TABLE ── */
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;
  padding:10px 14px;text-align:left;background:var(--panel2);border-bottom:1px solid var(--line);
  white-space:nowrap;position:sticky;top:0}
td{padding:10px 14px;font-size:13px;border-bottom:1px solid var(--line);vertical-align:middle;
  color:var(--text)}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:rgba(0,0,0,.015)}
[data-theme=dark] tbody tr:hover td{background:rgba(255,255,255,.03)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td b{font-weight:600;color:var(--text)}
td .help{font-size:11.5px;color:var(--muted);margin-top:1px;display:block}

/* ── STATUS PILLS ── */
.pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;
  font-size:11.5px;font-weight:500;white-space:nowrap}
.pill.green{background:rgba(31,157,91,.12);color:#1f9d5b}
.pill.amber{background:rgba(214,155,24,.12);color:#c68a10}
.pill.red{background:rgba(229,72,77,.12);color:#e5484d}
.pill.blue{background:rgba(33,150,243,.1);color:#1976d2}
.pill.gray,.pill.grey{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}

/* ── TYPE TAGS ── */
.tag{display:inline-block;padding:2px 7px;border-radius:5px;font-size:10.5px;font-weight:700;letter-spacing:.04em}
.tag.client{background:rgba(31,122,77,.12);color:#1f7a4d}
.tag.lead{background:rgba(33,150,243,.1);color:#1565c0}
.tag.prospect{background:rgba(255,152,0,.12);color:#e65100}

/* ── ROW ACTIONS ── */
.rowbtns{display:flex;gap:5px;align-items:center;justify-content:flex-end}

/* ── EMPTY STATE ── */
.empty{text-align:center;padding:36px 24px;color:var(--muted);font-size:13px}

/* ── MINI LIST (dashboard) ── */
.mini-list{padding:4px 0}
.mini-row{display:flex;justify-content:space-between;align-items:center;
  padding:8px 18px;border-bottom:1px solid var(--line);font-size:12.5px}
.mini-row:last-child{border-bottom:0}

/* ── KPI CARDS (original dashboard) ── */
.kpi{background:var(--panel);border-radius:var(--r);padding:18px;
  border:1px solid var(--line);box-shadow:var(--sh);display:flex;flex-direction:column;gap:6px}
.kpi.kpi-urgent{border-color:var(--danger)}
.kpi .ico{font-size:22px}
.kpi .lab{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kpi .val{font-size:26px;font-weight:700;color:var(--text)}

/* ── FORMS ── */
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field.full{grid-column:span 2}
.field.locked{opacity:.6}
.field label{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.field input,.field select,.field textarea{padding:9px 12px;border:1.5px solid var(--line);
  border-radius:8px;background:var(--panel2);color:var(--text);font-size:13.5px;transition:border .15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
.field textarea{resize:vertical;min-height:80px}
.field input.calc{background:rgba(31,122,77,.06);color:var(--accent);font-weight:600}
.field .help{font-size:11px;color:var(--muted)}

/* ── MODAL (legacy) ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;
  display:flex;align-items:center;justify-content:center;padding:20px}
.modal-bg .modal{background:var(--panel);border-radius:14px;max-width:720px;width:100%;
  max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden}
.modal-bg .modal header{display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;border-bottom:1px solid var(--line);flex-shrink:0}
.modal-bg .modal header h3{font-size:15px;font-weight:600}
.modal-bg .modal .body{flex:1;overflow-y:auto;padding:18px 20px}
.modal-bg .modal footer{padding:12px 20px;border-top:1px solid var(--line);
  display:flex;justify-content:flex-end;gap:10px;flex-shrink:0}
.iconbtn{padding:6px;border:0;background:transparent;color:var(--muted);
  border-radius:6px;font-size:16px;line-height:1;cursor:pointer;transition:background .12s}
.iconbtn:hover{background:var(--line)}

/* ── TOAST ── */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(10px);
  background:#1a2332;color:#e8f0f8;padding:10px 20px;border-radius:8px;font-size:13px;
  box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:9999;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── CLIENT HISTORY MODAL ── */
.client-header{margin-bottom:16px}
.ch-name{font-size:17px;font-weight:700;margin-bottom:4px}
.ch-meta{font-size:12.5px;color:var(--muted);margin-bottom:12px}
.ch-stats{display:flex;gap:10px;flex-wrap:wrap}
.ch-stat{background:var(--panel2);border-radius:8px;padding:10px 14px;border:1px solid var(--line);text-align:center}
.ch-stat .sv{font-size:18px;font-weight:700;color:var(--text)}
.ch-stat .sl{font-size:10.5px;color:var(--muted);margin-top:2px}
.timeline{padding:4px 0}
.tl-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.tl-item:last-child{border-bottom:0}
.tl-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;font-size:16px}
.tl-icon.call{background:rgba(31,122,77,.1)}
.tl-icon.meeting{background:rgba(33,150,243,.1)}
.tl-icon.deal{background:rgba(122,182,63,.1)}
.tl-icon.note{background:rgba(214,155,24,.1)}
.tl-body{flex:1;min-width:0}
.tl-head{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:3px}
.tl-title{font-size:13px;font-weight:500}
.tl-date{font-size:11.5px;color:var(--muted)}
.tl-tag{display:inline-block;padding:2px 7px;border-radius:4px;font-size:11px;
  background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.tl-tag.green{background:rgba(31,157,91,.1);color:#1f9d5b;border-color:transparent}
.tl-tag.amber{background:rgba(214,155,24,.1);color:#c68a10;border-color:transparent}
.tl-detail{font-size:12px;color:var(--muted)}
.tl-empty{text-align:center;padding:24px;color:var(--muted);font-size:13px}

/* ── ANALYTICS PAGE ── */
.ana-page{max-width:1200px}
.chart-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.chart-card{background:#1e2d3d;border-radius:12px;padding:18px;
  box-shadow:0 4px 16px rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.06)}
.chart-card.span2{grid-column:span 2}
.chart-card .ct{font-size:11.5px;font-weight:600;color:#8899aa;
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}

/* ── DASHBOARD NEW ── */
.dash-pg{max-width:1100px}
.pg-hdr{margin-bottom:18px}
.pg-hdr h2{font-size:20px;font-weight:700}
.pg-sub{font-size:12.5px;color:var(--muted)}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi-tile{background:var(--panel);border-radius:var(--r);padding:16px;
  border:1px solid var(--line);box-shadow:var(--sh);display:flex;align-items:center;gap:14px}
.kpi-tile.kpi-urgent{border-color:var(--danger)}
.kt-i{width:40px;height:40px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  background:rgba(31,122,77,.12);color:var(--accent)}
.kt-val{font-size:24px;font-weight:700;line-height:1;font-family:'Poppins',sans-serif}
.kt-lbl{font-size:11.5px;color:var(--muted);margin-top:3px}
.pipe-bars{display:flex;gap:4px;align-items:flex-end;height:72px;margin-bottom:6px}
.pipe-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.pipe-bar{width:100%;border-radius:4px 4px 0 0;background:linear-gradient(180deg,#7ab63f,#1f7a4d)}
.pipe-lbl{font-size:10px;color:var(--muted);text-align:center;line-height:1.3}
.pipe-lbl b{color:var(--text);display:block;font-size:12px}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.dash-card{background:var(--panel);border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--sh);overflow:hidden}
.dc-hdr{display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.dc-hdr h3{font-size:13px;font-weight:600}
.dc-link{font-size:11.5px;color:var(--accent);cursor:pointer}
.dc-link:hover{text-decoration:underline}
.mini-tbl{width:100%;border-collapse:collapse}
.mini-tbl th{font-size:10.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;
  padding:7px 16px;background:var(--panel2);border-bottom:1px solid var(--line);text-align:left}
.mini-tbl td{padding:8px 16px;font-size:12.5px;border-bottom:1px solid var(--line);vertical-align:middle;color:var(--text)}
.mini-tbl tr:last-child td{border-bottom:0}
.mini-tbl tbody tr:hover td{background:var(--panel2)}
.card-empty{padding:20px 16px;text-align:center;font-size:12.5px;color:var(--muted)}
.alert-strip{background:rgba(229,72,77,.07);border:1px solid rgba(229,72,77,.2);
  border-radius:9px;padding:11px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start;font-size:12.5px}
.alert-strip svg{color:var(--danger);flex-shrink:0;margin-top:1px}
.alert-strip strong{color:var(--danger)}
.ov-name{color:var(--accent);cursor:pointer;font-weight:500}
.ov-name:hover{text-decoration:underline}
.ov-date{color:var(--danger);font-size:11.5px}

/* ── ADMIN / MISC ── */
.pill.tl-tag{background:var(--panel2);color:var(--muted)}

/* ── PRINT ── */
@media print{#sidebarWrap,.topbar,#toast,#modalMount,.no-print{display:none!important}
  #mainArea{display:block}#view{padding:0;overflow:visible;height:auto}}

/* ── RESPONSIVE ── */
@media(max-width:860px){
  #sidebarWrap{width:50px}
  .sb-logo .ln,.sb-logo .ls,.sb-item span,.sb-sec-hdr .sb-sec-label,
  .sb-sec-hdr svg,.sb-search-wrap,.sb-who,.sb-role{display:none}
  .sb-item{padding:9px;justify-content:center;border-left:none}
  .sb-footer{flex-direction:column;padding:8px}
  .kpi-row{grid-template-columns:1fr 1fr}
  .dash-grid{grid-template-columns:1fr}
  .chart-grid{grid-template-columns:1fr}
  .chart-card.span2{grid-column:span 1}
  .formgrid{grid-template-columns:1fr}
  .field.full{grid-column:span 1}
}

@media(max-width:560px){
  .hamburger-btn{display:flex;align-items:center;justify-content:center}
  #sidebarWrap{position:fixed;top:0;left:0;width:240px!important;z-index:200;
    transform:translateX(-100%)}
  #sidebarWrap.mobile-open{transform:translateX(0)}
  #sidebarWrap.mobile-open .sb-logo .ln,#sidebarWrap.mobile-open .sb-logo .ls,
  #sidebarWrap.mobile-open .sb-item span,#sidebarWrap.mobile-open .sb-sec-hdr .sb-sec-label,
  #sidebarWrap.mobile-open .sb-sec-hdr svg,#sidebarWrap.mobile-open .sb-search-wrap,
  #sidebarWrap.mobile-open .sb-who,#sidebarWrap.mobile-open .sb-role{display:block}
  #sidebarWrap.mobile-open .sb-logo{display:flex}
  #sidebarWrap.mobile-open .sb-sec-hdr{display:flex}
  #sidebarWrap.mobile-open .sb-item{justify-content:flex-start;padding:8px 14px}
  #sidebarWrap.mobile-open .sb-footer{flex-direction:row}
  .sb-backdrop.show{display:block}
  .pagehead{flex-direction:column;align-items:stretch}
  #view{padding:12px}
  .modal-bg{padding:0}
  .modal-bg .modal{max-width:100%;height:100%;max-height:100vh;border-radius:0}
  #who{display:none}
  .conn-badge span{display:none}
  .topbar{padding:0 12px;gap:8px}
}

<!-- LOGIN -->
<div id="login">
  <div class="lcard">
    <div class="brand-row">
      <div class="brand-dot">PSG</div>
      <div><div style="font-weight:700;font-size:17px;color:#1a2332">PSG CRM</div>

    </div>
    <div class="lf"><label for="lg_user">Username</label>
      <input id="lg_user" type="text" placeholder="Enter username" autocomplete="username"
        onkeydown="if(event.key==='Enter')doLogin()"></div>
    <div class="lf"><label for="lg_pass">Password</label>
      <input id="lg_pass" type="password" placeholder="Enter password" autocomplete="current-password"
        onkeydown="if(event.key==='Enter')doLogin()"></div>

</div>

<!-- APP -->
<div id="app" class="hidden">

  <!-- Sidebar -->
  <div id="sidebarWrap">

        <input type="text" placeholder="Search…" oninput="sbSearch(this.value)" aria-label="Search navigation">

    <div class="sb-footer">

let sbCollapsed = {};

function renderSidebar(){
  const el=document.getElementById("sidebar");
  if(!el) return;
  const admin = typeof isAdmin==="function" ? isAdmin() : false;
  const cur   = typeof route!=="undefined" ? route : "dashboard";

  // Build set of real route IDs that are "active" — includes aliased ones
  const routeAliases = { clients:["_wq","_accounts"], vendors:["_vend"],
    leads:["_leads"], clientsOnly:["_contacts"], tasks:["_tasks"],
    deals:[], quotes:[], performance:["_forecast"], admin:["_agents"],
    salesOrders:["_so"], purchaseOrders:["_po"], invoices:["_inv"],
    dashboard:["_req"] };
  const activeIds = new Set([cur]);
  (routeAliases[cur]||[]).forEach(id=>activeIds.add(id));

  let h="";
  SIDEBAR_NAV.forEach(item=>{
    if(item.section){
      if(item.adminSection && !admin) return;
      const collapsed=sbCollapsed[item.section];
      const hasActive=item.items.some(n=>activeIds.has(n.id));
      h+=`<div class="sb-section">
        <button class="sb-sec-hdr${hasActive?" has-active":""}" onclick="sbToggle('${item.section}')" aria-expanded="${!collapsed}">
          <span class="sb-sec-label">${item.section}</span>
          ${svgIcon(collapsed?"chevron-right":"chevron-down",11)}
        </button>`;
      if(!collapsed){
        item.items.forEach(nav=>{
          if(nav.adminOnly && !admin) return;
          const active=activeIds.has(nav.id);
          const dest=nav.route||nav.id;
          const onclick=dest==="_soon"
            ? `toast("Coming soon")`
            : `go('${dest}')`;
          h+=`<button class="sb-item${active?" active":""}" onclick="${onclick}" title="${nav.label}">
            ${svgIcon(nav.icon,15)}
            <span>${nav.label}</span>
          </button>`;
        });
      }
      h+=`</div>`;
    } else {
      if(item.adminOnly && !(typeof isAdmin==="function"&&isAdmin())) return;
      const active=activeIds.has(item.id);
      const dest=item.route||item.id;
      const onclick=dest==="_soon" ? `toast("Coming soon")` : `go('${dest}')`;
      h+=`<button class="sb-item${active?" active":""}" onclick="${onclick}" title="${item.label}">
        ${svgIcon(item.icon,15)}
        <span>${item.label}</span>
      </button>`;
    }
  });
  el.innerHTML=h;
}

function sbToggle(s){ sbCollapsed[s]=!sbCollapsed[s]; renderSidebar(); }

function toggleMobileNav(){
  const sb=document.getElementById("sidebarWrap");
  const bd=document.getElementById("sbBackdrop");
  if(!sb||!bd) return;
  const open=sb.classList.toggle("mobile-open");
  bd.classList.toggle("show",open);
}
document.addEventListener("click",function(e){
  const sb=document.getElementById("sidebarWrap");
  if(sb && sb.classList.contains("mobile-open") && e.target.closest(".sb-item")){
    toggleMobileNav();
  }
});

/* ======================================================================
   COMPUTED FIELDS  (kept derived, exactly like the workbook formulas)
   ====================================================================== */
function dealValue(d){ return num(d.qty)*num(d.unitPrice); }                        // Qty × Unit Price
function dealCollected(d){ return num(d.collected); }                              // actual amount received (typed on the deal, not derived from status)
function dealCommission(d){ return dealCollected(d) * (num(d.commRate)/100); }        // collected × rate%
function clientTotalSales(id){ return state.deals.filter(d=>d.clientId===id).reduce((s,d)=>s+dealValue(d),0); }
function repTarget(rep){ const t=state.repTargets.find(x=>x.rep===rep); return t?num(t.target):0; }
function repCommRate(rep){ const t=state.repTargets.find(x=>x.rep===rep); return t&&t.commRate!=null?num(t.commRate):0; }
function repStats(rep){
  const ds = state.deals.filter(d=>d.rep===rep);
  const totalSales = ds.reduce((s,d)=>s+dealValue(d),0);
  const collected  = ds.reduce((s,d)=>s+dealCollected(d),0);
  const commission = ds.reduce((s,d)=>s+dealCommission(d),0);
  const target = repTarget(rep);
  const ach = target>0 ? totalSales/target : 0;
  let tier="📈 Needs Push", bonus=0;
  if(ach>=1){ tier="🏆 Top Performer"; bonus=commission*0.5; }
  else if(ach>=0.75){ tier="⭐ On Track"; bonus=commission*0.25; }
  return {rep, deals:ds.length, totalSales, collected, commission, target, ach, tier, bonus};
}

function initSupabase(){
  cloudOK=false; sb=null;
  if(cfg.url && cfg.key && window.supabase){

async function cloudPull(){
  if(!sb) return false;
  let anyOK=false;
  for(const k of ["users","clients","calls","meetings","deals","tasks","repTargets","quotes","salesOrders","invoices","purchaseOrders"]){
    try{
      const PAGE=1000; let all=[]; let offset=0;
      while(true){
        const {data,error}=await sb.from(MAP[k].table).select("*").range(offset, offset+PAGE-1);
        if(error) throw error;
        all = all.concat(data||[]);
        if(!data || data.length<PAGE) break;
        offset += PAGE;
      }
      state[k]=all.map(MAP[k].from);
      anyOK=true;
    }catch(e){ console.warn("Cloud pull failed for "+k+":", e.message); }
  }
  if(!state.users||!state.users.length) state.users=seedUsers();
  cloudOK=anyOK; return anyOK;
}
let __pollTimer=null;
function startAutoRefresh(){
  if(__pollTimer || !sb) return;
  __pollTimer=setInterval(async()=>{
    if(!session) return;
    const modalOpen = document.getElementById("modalMount") && document.getElementById("modalMount").innerHTML.trim().length>0;
    const ok = await cloudPull();
    if(ok){ renderConn(); if(!modalOpen){ renderRoute(); } }
  }, 20000);
}
async function upsert(kind, obj){
  saveLocal();
  if(sb){ try{ const {error}=await sb.from(MAP[kind].table).upsert(MAP[kind].to(obj)); if(error) throw error; cloudOK=true; }
          catch(e){ cloudOK=false; toast("Saved locally — cloud sync failed"); } }
  renderConn();
}
async function remove(kind, id){
  saveLocal();
  if(sb){ try{ const {error}=await sb.from(MAP[kind].table).delete().eq(MAP[kind].pk, id); if(error) throw error; cloudOK=true; }
          catch(e){ cloudOK=false; toast("Deleted locally — cloud sync failed"); } }
  renderConn();
}

/* filter helpers — employees only ever see their own rows */
function vClients(){ const base=state.clients.filter(c=>!c.isVendor); const r=myRep(); return r? base.filter(c=>c.assignedTo===r || !c.assignedTo) : base; }
function vVendors(){ return state.clients.filter(c=>c.isVendor); }

function vTasks(){ const r=myRep(); return r? state.tasks.filter(t=>t.assignedTo===r) : state.tasks; }

/* Ascending ID sort for Leads/Clients/Accounts: numeric IDs sort as numbers (1, 2, 20, 343...),
   non-numeric IDs (e.g. WhatsApp-bot leads like "PSG-00006") sort after, alphabetically. */
function idSort(a,b){
  const aId=String(a.id), bId=String(b.id);
  const aNum=/^\d+$/.test(aId), bNum=/^\d+$/.test(bId);
  if(aNum && bNum) return parseInt(aId,10)-parseInt(bId,10);
  if(aNum && !bNum) return -1;
  if(!aNum && bNum) return 1;
  return aId.localeCompare(bId);
}
function nextClientId(){
  const used=new Set(state.clients.map(c=>String(c.id)).filter(id=>/^\d+$/.test(id)).map(id=>parseInt(id,10)));
  let n=1; while(used.has(n)) n++;
  return String(n);
}

function renderDashboard(v){

        <b>${esc(c.company||client?.company||'')}</b>
        ${c.followDate?`<span class="help" style="margin-left:6px">${esc(c.followDate)}</span>`:''}
      </span>
      <span style="font-size:12px;color:var(--muted)">${esc(c.rep||'')}</span>
    </div>`;
  }).join("")||`<div class="empty" style="padding:20px">✅ No overdue follow-ups — great job!</div>`;

  // ── Upcoming meetings rows ──
  const meetRows = upcomingMeetings.map(m=>`
    <div class="mini-row">
      <span><b>${esc(m.company)}</b> <span class="pill blue">${esc(m.type||'')}</span></span>
      <span class="pill gray">${esc(m.date)} ${esc(m.time||'')}</span>
    </div>`).join("")||`<div class="empty" style="padding:20px">No meetings in the next 14 days</div>`;

  v.innerHTML=`
   <div class="pagehead"><div><h2>Dashboard</h2><div class="sub">${now.toLocaleDateString("en-GB",{weekday:"long",day:"2-digit",month:"short",year:"numeric"})} · ${scope} · Est. 1969, Karachi</div></div></div>

   <div class="kpis">
     ${kpi("👥","Total Clients / Leads",cs.length)}
     ${kpi("📞","Calls This Month",thisMonth)}
     ${kpi("🗓","Meetings Scheduled",meetingsSched)}
     ${kpi("💰","Total Sales",PKR(totalSales))}
     ${kpi("💵","Cash Collected",PKR(totalCollected))}
     ${kpi("🏆","Deals Won / Open",dealsWon+` <span style='font-size:14px;color:var(--muted);font-weight:500'>/ ${dealsPending}</span>`)}
     ${kpi("⚠️","Follow-ups Due",followCount, followCount>0)}
     ${kpi("😴","Untouched (30d)",untouchedClients.length, untouchedClients.length>5)}
   </div>

   ${followCount>0?`<div class="alert-banner">⏰ <b>${followCount} follow-up${followCount>1?'s':''} need attention</b> — click a row to open Call Log</div>`:''}

       <div class="mini-list">${followRows}</div>

     </div>

       <h3>🗓 Upcoming Meetings <span style="font-size:11px;font-weight:500;color:var(--muted);margin-left:8px">next 14 days</span></h3>
       <div class="mini-list">${meetRows}</div>
     </div>
   </div>

   <div class="grid2">
     <div class="card"><h3>📊 Pipeline by Status</h3><div class="mini-list">${statusRows}</div></div>
     ${isAdmin()?`<div class="card"><h3>🏅 Rep Leaderboard</h3><div class="mini-list">${repRows}</div></div>`
     :`<div class="card"><h3>📋 My Numbers</h3><div class="mini-list">${repStats(session.repName||'').deals>0?
       `<div class="mini-row"><span>Total Sales</span><b>${PKR(repStats(session.repName||'').totalSales)}</b></div>
        <div class="mini-row"><span>Commission Earned</span><b>${PKR(repStats(session.repName||'').commission)}</b></div>
        <div class="mini-row"><span>Achievement</span><b>${Math.round(repStats(session.repName||'').ach*100)}%</b></div>
        <div class="mini-row"><span>Status</span><b>${repStats(session.repName||'').tier}</b></div>`
       :'<div class="empty">No deals yet this period</div>'}</div></div>`}
   </div>`;
}
function statusPill(s){
  const green=["Deal Closed","Interested"], amber=["Proposal Sent","Meeting Scheduled","Follow-Up Required","Interested – Not Now"], red=["Not Interested","No Answer","Voicemail Left"];
  let c="gray"; if(green.includes(s))c="green"; else if(amber.includes(s))c="amber"; else if(red.includes(s))c="red";
  return `<span class="pill ${c}">${esc(s)}</span>`;

/* ======================================================================

   ====================================================================== */
// 11-stage sales pipeline (record_type) -- replaced the old flat Prospect/Lead/Client scheme.
// Client and Lost are closed/terminal: advanceStage() never reaches past Client, and markLost() is a
// separate explicit action -- nothing here auto-reopens a closed record. Won -- Order Confirmed means
// the first order was won; a record only becomes Client once it has repeat orders.
const STAGE_ORDER = ['New Inquiry','Quotation Sent','Follow-up / Negotiation','Quotation Approved','Order Confirmed','Advance Payment Received','Sales Order Created','Production Order Created','Production In Process','Production Completed & QC Passed','Balance Payment Received','Ready for Dispatch','Dispatched / Delivered','Order Closed'];
const STAGE_LOST = 'Lost';
const STAGE_COLORS = {
  'New Inquiry':                    {bg:'rgba(100,116,139,.12)', fg:'#475569'},
  'Quotation Sent':                 {bg:'rgba(255,152,0,.12)',   fg:'#e65100'},
  'Follow-up / Negotiation':        {bg:'rgba(234,88,12,.12)',   fg:'#c2410c'},
  'Quotation Approved':             {bg:'rgba(99,102,241,.12)',  fg:'#4338ca'},
  'Order Confirmed':                {bg:'rgba(147,51,234,.12)',  fg:'#7e22ce'},
  'Advance Payment Received':       {bg:'rgba(234,179,8,.14)',   fg:'#a16207'},
  'Sales Order Created':            {bg:'rgba(20,184,166,.12)',  fg:'#0f766e'},
  'Production Order Created':       {bg:'rgba(59,130,246,.12)',  fg:'#1d4ed8'},
  'Production In Process':          {bg:'rgba(33,150,243,.10)',  fg:'#1565c0'},
  'Production Completed & QC Passed':{bg:'rgba(14,165,164,.14)', fg:'#0e7490'},
  'Balance Payment Received':       {bg:'rgba(234,179,8,.14)',   fg:'#a16207'},
  'Ready for Dispatch':             {bg:'rgba(219,39,119,.12)',  fg:'#be185d'},
  'Dispatched / Delivered':         {bg:'rgba(31,122,77,.12)',   fg:'#1f7a4d'},
  'Order Closed':                   {bg:'rgba(21,87,36,.16)',    fg:'#155724'},
  'Lost':                           {bg:'rgba(220,38,38,.12)',   fg:'#b91c1c'}
};
const STAGE_BUCKETS = {
  prospects:  { stages:['New Inquiry'], title:'Prospects', noun:'prospect', addStage:'New Inquiry', route:'prospects' },
  leads:      { stages:['Quotation Sent','Follow-up / Negotiation','Quotation Approved','Order Confirmed','Advance Payment Received','Sales Order Created','Production Order Created','Production In Process','Production Completed & QC Passed','Balance Payment Received','Ready for Dispatch','Dispatched / Delivered'], title:'Leads', noun:'lead', addStage:'Quotation Sent', route:'leads' },
  clientsOnly:{ stages:['Order Closed'], title:'Clients', noun:'client', addStage:'Order Closed', route:'clientsOnly' }
};
function stageColor(rt){ return STAGE_COLORS[rt] || {bg:'rgba(100,116,139,.10)', fg:'#64748b'}; }
function stageLabel(rt){ return rt ? String(rt).toUpperCase() : 'UNKNOWN'; }
function nextStage(rt){ const i=STAGE_ORDER.indexOf(rt); return (i===-1||i===STAGE_ORDER.length-1) ? null : STAGE_ORDER[i+1]; }
function isClosedStage(rt){ return rt==='Order Closed' || rt===STAGE_LOST; }
const PIPE_SHORT={'New Inquiry':'Inquiry','Quotation Sent':'Quotation','Follow-up / Negotiation':'Negotiation','Quotation Approved':'Q. Approved','Order Confirmed':'Order Conf.','Advance Payment Received':'Adv. Payment','Sales Order Created':'Sales Order','Production Order Created':'Prod. Order','Production In Process':'In Production','Production Completed & QC Passed':'QC Passed','Balance Payment Received':'Bal. Payment','Ready for Dispatch':'Ready','Dispatched / Delivered':'Delivered','Order Closed':'Closed'};

function renderClients(v, bucketKey){
  const bucket = bucketKey ? STAGE_BUCKETS[bucketKey] : null;
  let rows=vClients();
  if(bucket) rows = rows.filter(c=>bucket.stages.includes(c.recordType));
  rows = rows.filter(matchSearch);
  rows = rows.slice().sort(idSort);
  const body = rows.length? rows.map(c=>{
    const sc = stageColor(c.recordType);
    const ns = nextStage(c.recordType);
    const closed = isClosedStage(c.recordType);
    return `<tr>
    <td><span class="tag" style="background:${sc.bg};color:${sc.fg}">${esc(stageLabel(c.recordType))}</span></td>
    <td>${esc(c.id)}</td>
    <td><b>${esc(c.company)}</b>${c.city?`<br><span class="help">${esc(c.city)}</span>`:""}</td>
    <td>${esc(c.contact)}${c.designation?`<br><span class="help">${esc(c.designation)}</span>`:""}</td>
    <td>${esc(c.phone)}</td>
    <td>${esc(c.industry)}</td>
    <td>${c.status?statusPill(c.status):""}</td>
    <td>${esc(c.assignedTo)}</td>
    <td class="num">${clientTotalSales(c.id)?PKR(clientTotalSales(c.id)):"—"}</td>
    <td class="no-print"><div class="rowbtns"><button class="btn sm ghost" title="Activity History" onclick="openClientHistory('${esc(c.id)}')">📋</button><button class="btn sm ghost" title="Send WhatsApp" onclick="waClient('${esc(c.id)}')">💬</button>${ns?`<button class="btn sm ghost" title="Advance to ${esc(ns)}" onclick="advanceStage('${esc(c.id)}')">➔ ${esc(ns)}</button>`:""}${!closed?`<button class="btn sm ghost danger" title="Mark Lost" onclick="markLost('${esc(c.id)}')">Lost</button>`:""}<button class="btn sm ghost" onclick="edit_client('${esc(c.id)}')">Edit</button>${isAdmin()?`<button class="btn sm ghost danger" onclick="del_client('${esc(c.id)}')">✕</button>`:""}</div></td></tr>`;
  }).join("")
    : `<tr><td colspan="10"><div class="empty">No ${bucket?bucket.noun+'s':'records'} found.${bucket?` Click "Add ${bucket.title.slice(0,-1)}" to create one.`:''}</div></td></tr>`;
  const importBtns = bucket ? "" : `<input type="file" id="csvImportInput" accept=".csv" style="display:none" onchange="importClientsCsv(this.files[0]);this.value='';">

// Reaching Won implies a real sale: auto-fill the Sales Tracker (and the fulfillment Sales
// Order behind it) from whatever quote this client actually has, instead of leaving reps to
// retype client/quote/qty by hand. Guarded so re-advancing (or a duplicate click) never creates
// a second Deal/SO for the same quote -- it just leaves the existing ones alone.
function autoCreateDealAndOrder(c){
  const clientQuotes=state.quotes.filter(x=>x.clientId===c.id);
  const byRecency=(a,b)=>(b.quoteDate||"").localeCompare(a.quoteDate||"")||(b.id||"").localeCompare(a.id||"");
  const bestQuote=clientQuotes.filter(x=>x.status==="Sent"||x.status==="Accepted").sort(byRecency)[0]
    || clientQuotes.slice().sort(byRecency)[0];

  let deal = bestQuote ? state.deals.find(x=>x.clientId===c.id && x.quoteNo===bestQuote.id) : null;
  if(!deal){
    if(bestQuote){
      deal = dealFromQuote(bestQuote, {remarks:"Auto-created \u2014 "+c.company+" advanced to Won \u2013 Order Confirmed"});
    } else {
      const rep=c.assignedTo||myRep()||"";
      deal = {closeDate:today(),rep,clientId:c.id,company:c.company,product:"",qty:0,unitPrice:0,quoteNo:"",poNumber:"",collectStatus:"Pending",collected:0,commRate:repCommRate(rep),remarks:"Auto-created \u2014 "+c.company+" advanced to Won \u2013 Order Confirmed (no quote on file yet)"};
    }
    deal.id=nextId("DL",deal.rep); state.deals.push(deal); upsert("deals",deal);
    if(bestQuote && bestQuote.status!=="Accepted"){ bestQuote.status="Accepted"; upsert("quotes",bestQuote); }
  }

  let so = state.salesOrders.find(x=>x.dealId===deal.id);
  if(!so){
    so = salesOrderFromDeal(deal);
    so.id=nextId("SO",so.rep); state.salesOrders.push(so); upsert("salesOrders",so);
  }
}

function normalizePhone(p){
  let d=String(p||"").replace(/\D/g,"");
  if(!d) return "";
  if(d.startsWith("92") && d.length===12) d="0"+d.slice(2);
  else if(d.length===10) d="0"+d;
  if(d.length!==11) return String(p||"").trim();
  return d.slice(0,4)+"-"+d.slice(4);
}
function phoneDigits(p){ const d=String(p||"").replace(/[^0-9]/g,""); return d.length>10?d.slice(-10):d; }
function normCompanyName(s){ return String(s||"").trim().toLowerCase().replace(/\s+/g," "); }
/* Finds an existing client that looks like the same real-world company: same
   phone number (last 10 digits), or same company name (case/whitespace-insensitive)
   when no phone is on file. excludeId lets edit flows skip matching themselves. */
function findDupClient(candidate, excludeId){
  const pd=phoneDigits(candidate.phone);
  const cn=normCompanyName(candidate.company);
  return state.clients.find(x=>{
    if(excludeId && x.id===excludeId) return false;
    if(pd && phoneDigits(x.phone)===pd) return true;
    if(!pd && cn && normCompanyName(x.company)===cn) return true;
    return false;
  });
}

function parseCSV(text){
  const rows=[]; let row=[]; let field=""; let inQuotes=false;
  text = text.replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else { inQuotes=false; } }
      else field+=c;
    } else {
      if(c==='"') inQuotes=true;
      else if(c===','){ row.push(field); field=""; }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=""; }
      else field+=c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.some(v=>String(v).trim()!==""));
}
const CSV_FIELD_MAP = {
  "client id":"_id","id":"_id",
  "company":"company","company name":"company",
  "contact":"contact","contact person":"contact","contact name":"contact",
  "designation":"designation","title":"designation",
  "phone":"phone","phone number":"phone","mobile":"phone","contact number":"phone",
  "email":"email",
  "city":"city",
  "industry":"industry",
  "lead source":"leadSource","leadsource":"leadSource","source":"leadSource",
  "priority":"priority",
  "assigned to":"assignedTo","assignedto":"assignedTo","rep":"assignedTo","sales rep":"assignedTo",
  "first contact":"firstContact","firstcontact":"firstContact","first contact date":"firstContact",
  "last contact":"lastContact","lastcontact":"lastContact","last contact date":"lastContact",
  "status":"status",
  "notes":"notes","note":"notes",
  "revenue potential":"revenuePotential","revenuepotential":"revenuePotential",
  "annual revenue potential (pkr)":"revenuePotential","revenue potential (pkr)":"revenuePotential",
  "record type":"recordType","type":"recordType",
  "active":"active","active?":"active",
};

  const blob=new Blob([csv],{type:"text/csv"}); const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download="psg_crm_client_import_template.csv"; a.click(); URL.revokeObjectURL(url);

async function importClientsCsv(file){
  if(!file) return;
  let text;
  try{ text = await file.text(); }catch(e){ toast("Could not read file"); return; }
  const rows = parseCSV(text);
  if(rows.length<2){ toast("CSV has no data rows"); return; }

  // Auto-detect the real header row: scan the first few rows for one that
  // contains a recognizable "company" column — skips title/banner rows like
  // "PSG CRM — SHARED CLIENT DATABASE" that sometimes sit above the headers.
  let headerIdx=-1, fieldFor=null;
  for(let i=0;i<Math.min(5,rows.length);i++){
    const headers=rows[i].map(h=>String(h||"").trim().toLowerCase());
    const mapped=headers.map(h=>CSV_FIELD_MAP[h]||null);
    if(mapped.includes("company")){ headerIdx=i; fieldFor=mapped; break; }
  }
  if(headerIdx===-1){ toast("CSV must have a Company (or Company Name) column"); return; }

  const newClients=[]; let updated=0;
  for(let i=headerIdx+1;i<rows.length;i++){
    const r=rows[i]; const obj={};
    fieldFor.forEach((f,idx)=>{ if(f) obj[f]=String(r[idx]??"").trim(); });
    if(!obj.company) continue;
    const suppliedId=obj._id; delete obj._id;
    obj.recordType = (()=>{ const raw=String(obj.recordType||"").trim(); if(!raw) return "Client"; const known=STAGE_ORDER.concat([STAGE_LOST]).find(s=>s.toLowerCase()===raw.toLowerCase()); return known||raw; })();
    obj.active = obj.active ? !/^(no|false|0)$/i.test(obj.active) : true;
    obj.revenuePotential = num(obj.revenuePotential);
    if(obj.phone) obj.phone = normalizePhone(obj.phone);
    // Match by supplied ID first, then fall back to phone/company so re-importing
    // the same client under a different ID doesn't create a duplicate row.
    let existing = suppliedId ? state.clients.find(x=>x.id===suppliedId) : null;
    if(!existing) existing = findDupClient(obj);
    if(existing){ Object.assign(existing, obj); updated++; newClients.push(existing); }
    else { obj.id = suppliedId || nextIdForImport(); state.clients.push(obj); newClients.push(obj); }
  }
  if(!newClients.length){ toast("No valid rows found (need at least Company)"); return; }

  saveLocal();
  go("clients");
  toast("Importing "+newClients.length+" clients…");

  if(sb){
    // Sync in chunks of 300, but never let one bad row silently swallow the rest of its
    // chunk: on a batch failure, split in half and retry recursively until either it
    // succeeds or we've isolated the exact row(s) that failed, so a single malformed
    // value (a bad date, a stray character) can't wipe out hundreds of good rows.
    let ok=0, fail=0; const failedRows=[];
    async function syncBatch(batch){
      if(!batch.length) return;
      try{
        const {error}=await sb.from(MAP.clients.table).upsert(batch.map(MAP.clients.to));
        if(error) throw error;
        ok+=batch.length;
      }catch(e){
        if(batch.length===1){
          fail+=1;
          failedRows.push({company:batch[0].company||"(no company)", reason:(e&&e.message)||String(e)});
        } else {
          const mid=Math.ceil(batch.length/2);
          await syncBatch(batch.slice(0,mid));
          await syncBatch(batch.slice(mid));
        }
      }
    }
    const CHUNK=300;
    for(let i=0;i<newClients.length;i+=CHUNK){
      await syncBatch(newClients.slice(i,i+CHUNK));
    }
    cloudOK = fail===0 ? true : cloudOK;
    renderConn();
    if(fail){
      console.warn("Import rows that failed to sync:", failedRows);
      const list=failedRows.slice(0,50).map(r=>"<li><b>"+esc(r.company)+"</b> — "+esc(r.reason)+"</li>").join("");
      const more=failedRows.length>50?('<p style="margin-top:8px;color:var(--muted)">+'+(failedRows.length-50)+' more — see browser console for the full list.</p>'):"";
      openModal("Import sync report", "<p>"+ok+" synced to the cloud, "+fail+" FAILED and were saved locally only.</p><ul style=\"max-height:280px;overflow:auto;margin:10px 0 0;padding-left:20px\">"+list+"</ul>"+more, async()=>{ closeModal(); });
      toast("Imported "+ok+" ("+updated+" updated) · "+fail+" FAILED to sync — see report");
    } else {
      toast("Imported "+ok+" clients ("+updated+" updated)");
    }
  } else {
    toast("Imported "+newClients.length+" clients locally — connect cloud to sync");
  }
  go("clients");
}

    : ("record"+(rows.length===1?"":"s")+" (every pipeline stage)");
  confirmDel("Delete ALL "+rows.length+" "+label+"? This also deletes every call, meeting, deal & task linked to them. This cannot be undone.", async()=>{
    const idSet=new Set(rows.map(c=>String(c.id)));
    state.clients=state.clients.filter(c=>!idSet.has(String(c.id)));
    for(const k of ["calls","meetings","deals","tasks"]){ state[k]=state[k].filter(x=>!idSet.has(String(x.clientId))); }
    saveLocal();
    if(sb){
      const CHUNK=200; const ids=[...idSet];
      for(const k of ["calls","meetings","deals","tasks"]){
        for(let i=0;i<ids.length;i+=CHUNK){ try{ await sb.from(MAP[k].table).delete().in("client_id", ids.slice(i,i+CHUNK)); }catch(e){ console.warn(k+" bulk delete failed:",e.message); } }
      }
      for(let i=0;i<ids.length;i+=CHUNK){ try{ await sb.from(MAP.clients.table).delete().in(MAP.clients.pk, ids.slice(i,i+CHUNK)); }catch(e){ console.warn("bulk client delete failed:",e.message); } }
    }
    toast("Deleted "+rows.length+" "+label); go(route);
  });
}

function readSalesOrder(existing){ const g=id=>document.getElementById("f_"+id).value; const id=g("clientId"); const cl=state.clients.find(x=>x.id===id);

/* ======================================================================

   real typed number, same partial-payment convention as Deals.collected.
   ====================================================================== */
function vInvoices(){ const r=myRep(); return r? state.invoices.filter(x=>x.rep===r) : state.invoices; }
function invoiceBalance(inv){ return num(inv.amount)-num(inv.amountPaid); }
function invoiceStatusPill(s){ const c={Paid:"green",Partial:"amber",Unpaid:"gray",Overdue:"red"}[s]||"gray"; return `<span class="pill ${c}">${esc(s||"")}</span>`; }
function invoiceFromSO(so){
  return {invoiceDate:today(),dueDate:"",salesOrderId:so.id,dealId:so.dealId||"",clientId:so.clientId,company:so.company,rep:so.rep,amount:soValue(so),amountPaid:0,status:"Unpaid",notes:"Generated from sales order "+so.id};
}
function generateInvoiceFromSO(soId){
  const so=state.salesOrders.find(x=>x.id===soId); if(!so)return;
  const existing=state.invoices.find(x=>x.salesOrderId===soId);
  if(existing){ toast("An invoice already exists for this sales order"); go("invoices"); return; }
  const inv=invoiceFromSO(so);
  inv.id=nextId("IV",inv.rep); state.invoices.push(inv); upsert("invoices",inv);
  toast("Invoice generated"); go("invoices");
}
function renderInvoices(v){
  const rows=vInvoices().filter(matchSearch);
  const body=rows.length?rows.map(inv=>`<tr>
    <td>${esc(inv.id)}</td><td>${esc(inv.invoiceDate)}</td><td><b>${esc(inv.company)}</b></td><td>${esc(inv.rep)}</td>
    <td>${esc(inv.salesOrderId||"")}</td>
    <td class="num">${PKR(inv.amount)}</td><td class="num">${PKR(inv.amountPaid)}</td><td class="num">${PKR(invoiceBalance(inv))}</td>
    <td>${invoiceStatusPill(inv.status)}</td><td>${esc(inv.dueDate||"")}</td>
    <td class="no-print"><div class="rowbtns"><button class="btn sm ghost" onclick="edit_invoice('${esc(inv.id)}')">Edit</button><button class="btn sm ghost danger" onclick="del_invoice('${esc(inv.id)}')">✕</button></div></td></tr>`).join("")
    :`<tr><td colspan="11"><div class="empty">No invoices yet.</div></td></tr>`;
  const total=rows.reduce((s,inv)=>s+num(inv.amount),0), paid=rows.reduce((s,inv)=>s+num(inv.amountPaid),0);
  v.innerHTML=pagehead("Invoices","Invoices — "+vInvoices().length+" · Billed "+PKR(total)+" · Paid "+PKR(paid)+(isAdmin()?"":" (yours)"),"Add Invoice","addInvoice()",true)+
   `<div class="card tablewrap"><table><thead><tr><th>Invoice #</th><th>Date</th><th>Client</th><th>Rep</th><th>SO #</th><th class="num">Amount</th><th class="num">Paid</th><th class="num">Balance</th><th>Status</th><th>Due</th><th></th></tr></thead><tbody>${body}</tbody></table></div>`;
}
function invoiceForm(inv){ inv=inv||{}; const rep=myRep();
  const statusOpts=["Unpaid","Partial","Paid","Overdue"];
  return `<div class="formgrid">
    <div class="field"><label>Invoice Date</label><input id="f_invoiceDate" type="date" value="${esc(inv.invoiceDate||today())}"></div>
    <div class="field"><label>Due Date</label><input id="f_dueDate" type="date" value="${esc(inv.dueDate||"")}"></div>
    <div class="field ${rep?'locked':''}"><label>Sales Rep</label><input id="f_rep" value="${esc(inv.rep||rep||"")}" ${rep?"readonly":""}></div>
    <div class="field full"><label>Client</label><select id="f_clientId">${clientOptions(inv.clientId)}</select></div>
    <div class="field"><label>Sales Order #</label><input id="f_salesOrderId" value="${esc(inv.salesOrderId||"")}"></div>
    <div class="field"><label>Amount (PKR)</label><input id="f_amount" type="number" step="any" value="${esc(inv.amount||"")}" oninput="calcInvoice()"></div>
    <div class="field"><label>Amount Paid (PKR)</label><input id="f_amountPaid" type="number" step="any" value="${esc(inv.amountPaid!=null?inv.amountPaid:"")}" oninput="calcInvoice()"></div>

function readInvoice(existing){ const g=id=>document.getElementById("f_"+id).value; const id=g("clientId"); const cl=state.clients.find(x=>x.id===id);

function edit_invoice(id){ const inv=state.invoices.find(x=>x.id===id); if(!inv)return; openModal("Edit Invoice", invoiceForm(inv), async()=>{ Object.assign(inv,readInvoice(inv)); await upsert("invoices",inv); closeModal(); toast("Invoice updated"); go("invoices"); }, calcInvoice); }

function quoteItemAmount(it){ return num(it&&it.pieces)*num(it&&it.unitPrice); }
function quoteTotal(items){ return (items||[]).reduce((s,it)=>s+quoteItemAmount(it),0); }
function quoteSumQty(items){ return (items||[]).reduce((s,it)=>s+num(it.pieces),0); }
function quoteSumByType(items,type){ return (items||[]).reduce((s,it)=>s+((it.type||"Glass")===type?num(it.pieces):0),0); }
function mmToInchFrac(mm){
  mm=num(mm); if(!mm) return "";
  const inch=mm/25.4; let whole=Math.floor(inch); let frac=Math.round((inch-whole)*8);
  if(frac===8){ whole+=1; frac=0; }
  if(frac===0) return String(whole);
  const g=(a,b)=>b?g(b,a%b):a; const gg=g(frac,8);
  return whole+" "+(frac/gg)+"/"+(8/gg);
}
function quoteStatusPill(s){ const c={Draft:"gray",Sent:"amber",Accepted:"green",Rejected:"red",Expired:"gray"}[s]||"gray"; return `<span class="pill ${c}">${esc(s||"Draft")}</span>`; }
function renderQuotes(v){
  const rows=vQuotes().filter(matchSearch);
  const body=rows.length?rows.map(q=>{
    const total=quoteTotal(q.items);
    return `<tr>
    <td>${esc(q.id)}</td><td>${esc(q.quoteDate)}</td><td><b>${esc(q.company)}</b></td><td>${esc(q.contact)}</td><td>${esc(q.rep)}</td>
    <td class="num">${(q.items||[]).length}</td>
    <td class="num"><b>${PKR(total)}</b></td>
    <td>${quoteStatusPill(q.status)}</td>
    <td>${q.pdfData?"📎":""}</td>
    <td class="no-print"><div class="rowbtns">
      <button class="btn sm ghost" title="View / Print" onclick="viewQuote('${esc(q.id)}')">👁</button>
      <button class="btn sm ghost" title="Send WhatsApp" onclick="waQuote('${esc(q.id)}')">💬</button>
      <button class="btn sm ghost" title="Convert to Deal" onclick="convertQuoteToDeal('${esc(q.id)}')">➔ Deal</button>
      <button class="btn sm ghost" onclick="edit_quote('${esc(q.id)}')">Edit</button>
      <button class="btn sm ghost danger" onclick="del_quote('${esc(q.id)}')">✕</button>
    </div></td></tr>`;
  }).join("")
    :`<tr><td colspan="10"><div class="empty">No quotes yet.</div></td></tr>`;
  const grandTotal=rows.reduce((s,q)=>s+quoteTotal(q.items),0);
  v.innerHTML=pagehead("Quotes","Quotes — "+vQuotes().length+" · Value "+PKR(grandTotal)+(isAdmin()?"":" (yours)"),"Add Quote","addQuote()",true)+
   `<div class="card tablewrap"><table><thead><tr><th>Quote #</th><th>Date</th><th>Client</th><th>Contact</th><th>Rep</th><th class="num">Items</th><th class="num">Total</th><th>Status</th><th>File</th><th></th></tr></thead><tbody>${body}</tbody></table></div>`;
}

    <div class="field"><label>Size H (mm)</label><input id="qi_sizeH_${i}" type="number" step="any" value="${esc(it.sizeH||"")}" oninput="quoteItemEdit(${i},'sizeH',this.value)"></div>

// Shared by the manual "Convert to Deal" button on Quotes and the automatic Won-stage
// conversion in autoCreateDealAndOrder(): turns a quote's line items into a single Deal.
// Where the quote has real glass-item sqft data, Qty/Unit Price reflect the actual blended
// sqft rate rather than the old qty=1/unitPrice=total placeholder, so "Qty (sqft)" on the
// Deal and Sales Order means what it says.
function dealFromQuote(q, opts){
  opts=opts||{};
  const total=quoteTotal(q.items);
  const glassItems=(q.items||[]).filter(it=>(it.type||"Glass")==="Glass");
  const sumSqft=glassItems.reduce((s,it)=>s+num(it.sqft)*num(it.pieces),0);
  const product=(q.items||[]).map(it=>it.desc).filter(Boolean).join(", ")||"See quote "+q.id;
  let qty, unitPrice;
  if(sumSqft>0){ qty=Math.round(sumSqft*100)/100; unitPrice=Math.round((total/sumSqft)*100)/100; }
  else { qty=1; unitPrice=total; }
  return {closeDate:today(),rep:q.rep,clientId:q.clientId,company:q.company,product,qty,unitPrice,quoteNo:q.id,poNumber:"",collectStatus:"Pending",collected:0,commRate:repCommRate(q.rep),remarks:opts.remarks||("Converted from quote "+q.id)};
}
function convertQuoteToDeal(id){
  const q=state.quotes.find(x=>x.id===id); if(!q)return;
  const d=dealFromQuote(q);
  d.id=nextId("DL",d.rep); state.deals.push(d);
  upsert("deals",d);
  if(q.status!=="Accepted"){ q.status="Accepted"; upsert("quotes",q); }
  toast("Deal created from quote"); go("deals");
}

async function normalizeAllPhones(){
  let changed=0;
  for(const c of state.clients){ const n=normalizePhone(c.phone); if(n!==c.phone){ c.phone=n; changed++; } }
  if(!changed){ toast("All phone numbers already normalized"); return; }
  saveLocal();
  if(sb){
    const CHUNK=300; const rows=state.clients.map(MAP.clients.to);
    for(let i=0;i<rows.length;i+=CHUNK){ try{ await sb.from(MAP.clients.table).upsert(rows.slice(i,i+CHUNK)); }catch(e){ console.warn("normalize sync failed:",e.message); } }
  }
  toast("Normalized "+changed+" phone number(s)"); go("admin");
}

    for(let i=0;i<rows.length;i+=CHUNK){ try{ await sb.from(MAP.clients.table).upsert(rows.slice(i,i+CHUNK)); }catch(e){ console.warn("industry rename sync failed:",e.message); } }
  }

}
async function normalizeClientIds(){
  // Pass 1: strip leading zeros from purely-numeric IDs like "0000020" -> "20" (skip if the
  // target number already belongs to a different record).
  const renames=[];
  for(const c of state.clients){
    const idStr=String(c.id);
    if(/^0+\d+$/.test(idStr)){
      const newId=String(parseInt(idStr,10));
      if(newId!==idStr && !state.clients.some(x=>x!==c && String(x.id)===newId)) renames.push({oldId:idStr,newId,client:c});
    }
  }
  for(const r of renames) r.client.id=r.newId;

  // Pass 2: renumber anything still non-numeric (e.g. a WhatsApp-bot lead that was stamped
  // with the Google Sheet's own "PSG-00007" Client ID) to the next free plain number, so
  // every client/lead ID ends up an ordinary ascending integer regardless of source.
  const used=new Set(state.clients.map(c=>String(c.id)).filter(id=>/^\d+$/.test(id)).map(id=>parseInt(id,10)));
  function nextFree(){ let n=1; while(used.has(n)) n++; used.add(n); return n; }
  for(const c of state.clients){
    const idStr=String(c.id);
    if(!/^\d+$/.test(idStr)){
      const newId=String(nextFree());
      renames.push({oldId:idStr,newId,client:c});
      c.id=newId;
    }
  }

  if(!renames.length){ toast("No client IDs need normalizing"); return; }

  for(const r of renames){
    for(const k of ["calls","meetings","deals","tasks"]){
      for(const x of state[k]){ if(x.clientId===r.oldId) x.clientId=r.newId; }
    }
  }
  saveLocal();

  if(sb){
    for(const r of renames){
      try{ await sb.from(MAP.clients.table).delete().eq(MAP.clients.pk, r.oldId); }catch(e){ console.warn("old client id delete failed:",e.message); }
    }
    const CHUNK=300;
    const clientRows=state.clients.map(MAP.clients.to);
    for(let i=0;i<clientRows.length;i+=CHUNK){ try{ await sb.from(MAP.clients.table).upsert(clientRows.slice(i,i+CHUNK)); }catch(e){ console.warn("client id sync failed:",e.message); } }
    for(const k of ["calls","meetings","deals","tasks"]){
      const rows=state[k].map(MAP[k].to);
      for(let i=0;i<rows.length;i+=CHUNK){ try{ await sb.from(MAP[k].table).upsert(rows.slice(i,i+CHUNK)); }catch(e){ console.warn(k+" id-cascade sync failed:",e.message); } }
    }
  }
  toast("Normalized "+renames.length+" client ID(s)"); go("admin");
}

  const t=encodeURIComponent(text);
  if(mode==="web")   return "https://web.whatsapp.com/send?phone="+num+"&text="+t;   // WhatsApp Web client (skips landing page)
  if(mode==="phone") return "https://wa.me/"+num+"?text="+t;                          // universal link

}
function waFire(mode,num,text){
  if(mode!=="app"){
    const a=document.createElement("a"); a.href=waUrl(mode,num,text); a.target="_blank"; a.rel="noopener";
    document.body.appendChild(a); a.click(); a.remove();
    return;
  }
  // Desktop app mode: try the whatsapp:// handler; if the tab never loses focus
  // (i.e. no app took over) within a short window, assume WhatsApp Desktop isn't
  // installed and fall back to the wa.me web link instead of failing silently.
  let handedOff=false;
  const markHandedOff=()=>{ handedOff=true; };
  window.addEventListener("blur", markHandedOff, {once:true});
  document.addEventListener("visibilitychange", markHandedOff, {once:true});
  const a=document.createElement("a"); a.href=waUrl("app",num,text);
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>{
    window.removeEventListener("blur", markHandedOff);
    document.removeEventListener("visibilitychange", markHandedOff);
    if(!handedOff){
      toast("WhatsApp Desktop not found — opening WhatsApp Web instead");
      const b=document.createElement("a"); b.href=waUrl("phone",num,text); b.target="_blank"; b.rel="noopener";
      document.body.appendChild(b); b.click(); b.remove();
    }
  }, 1500);
}

  const base={responsive:true,maintainAspectRatio:true,plugins:{legend:{labels:{color:T,font:{size:11}}}},scales:{x:{grid:{color:G},ticks:{color:T,font:{size:10}}},y:{grid:{color:G},ticks:{color:T,font:{size:10}}}}};

  v.innerHTML=`<div class="ana-page">
  <div class="pg-hdr"><h2>Analytics</h2><span class="pg-sub">Performance overview</span></div>
  <div class="chart-grid">
    <div class="chart-card span2"><div class="ct">Monthly Call Volume</div><canvas id="c_calls" height="80"></canvas></div>
    <div class="chart-card"><div class="ct">Revenue by Rep (PKR)</div><canvas id="c_rev" height="130"></canvas></div>
    <div class="chart-card"><div class="ct">Clients by Industry</div><canvas id="c_ind" height="130"></canvas></div>
    <div class="chart-card span2"><div class="ct">Rep vs Target</div><canvas id="c_tgt" height="80"></canvas></div>
    <div class="chart-card"><div class="ct">Pipeline Stages</div><canvas id="c_pipe" height="130"></canvas></div>
    <div class="chart-card"><div class="ct">Monthly Deal Value</div><canvas id="c_deals" height="130"></canvas></div>
  </div></div>`;

  requestAnimationFrame(()=>{
    _acharts.calls=new Chart(document.getElementById("c_calls"),{type:"bar",data:{labels:months,datasets:[{label:"Calls",data:callCounts,backgroundColor:"#4caf89",borderRadius:4}]},options:{...base,plugins:{...base.plugins,legend:{display:false}}}});
    _acharts.rev=new Chart(document.getElementById("c_rev"),{type:"bar",data:{labels:repNames,datasets:[{label:"Revenue",data:repRev,backgroundColor:P,borderRadius:4}]},options:{...base,indexAxis:"y",plugins:{...base.plugins,legend:{display:false}}}});
    _acharts.ind=new Chart(document.getElementById("c_ind"),{type:"doughnut",data:{labels:indL,datasets:[{data:indD,backgroundColor:P,borderWidth:0,hoverOffset:4}]},options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{position:"right",labels:{color:T,font:{size:10},boxWidth:10}}}}});
    _acharts.tgt=new Chart(document.getElementById("c_tgt"),{type:"bar",data:{labels:repNames,datasets:[{label:"Target",data:repTgt,backgroundColor:"rgba(255,255,255,.12)",borderRadius:4},{label:"Actual",data:repAct,backgroundColor:"#4caf89",borderRadius:4}]},options:{...base}});
    _acharts.pipe=new Chart(document.getElementById("c_pipe"),{type:"bar",data:{labels:stages,datasets:[{label:"Deals",data:stageCt,backgroundColor:P,borderRadius:4}]},options:{...base,indexAxis:"y",plugins:{...base.plugins,legend:{display:false}}}});
    _acharts.deals=new Chart(document.getElementById("c_deals"),{type:"line",data:{labels:months,datasets:[{label:"Value",data:dealVals,borderColor:"#4caf89",backgroundColor:"rgba(76,175,137,.15)",fill:true,tension:.35,pointRadius:3}]},options:{...base,plugins:{...base.plugins,legend:{display:false}}}});
  });
}


window.renderDashboard=function(v){
  if(!v)v=document.getElementById("view");
  const today=new Date();const todayStr=today.toISOString().slice(0,10);
  const ca=state.clients||[];
  const cl=state.calls||[];
  const me=state.meetings||[];
  const de=state.deals||[];
  const admin=typeof isAdmin==="function"&&isAdmin();
  const rep=typeof session!=="undefined"?(session.repName||session.username||""):"";
  const myC=vClients(); // same visibility rule as the Clients/Leads pages: your records + unassigned ones
  const myD=admin?de:de.filter(d=>d.rep===rep);
  const myCl=admin?cl:cl.filter(c=>c.rep===rep);
  const myM=admin?me:me.filter(m=>m.rep===rep);
  const fmt=n=>"PKR "+Number(n||0).toLocaleString();
  const fd=d=>d?new Date(d).toLocaleDateString("en-GB",{day:"2-digit",month:"short"}):"—";
  const openDeals=myD.filter(d=>!["Closed Won","Closed Lost"].includes(d.stage||""));
  const todayCalls=myCl.filter(c=>(c.date||"").slice(0,10)===todayStr);
  const revenue=myD.filter(d=>d.collectStatus==="Received").reduce((s,d)=>s+(parseFloat(d.qty||0)*parseFloat(d.unitPrice||0)),0);
  const overdue=myC.filter(c=>{const f=c.followDate||c.followUpDate||"";return f&&f<todayStr&&c.status!=="Closed";}).slice(0,5);
  const upcoming=myM.filter(m=>{const d=new Date(m.date||"");return d>=today&&(d-today)<7*864e5;}).sort((a,b)=>new Date(a.date)-new Date(b.date)).slice(0,5);
  const openTasks=myD.filter(d=>["Prospect","Qualified","Proposal","Negotiation"].includes(d.stage||d.dealStage||"")).slice(0,5);
  const closing=myD.filter(d=>{const cd=new Date(d.closeDate||d.date||"");return cd.getFullYear()===today.getFullYear()&&cd.getMonth()===today.getMonth()&&!["Closed Won","Closed Lost"].includes(d.stage||"");}).slice(0,5);
  const gr=today.getHours()<12?"Morning":today.getHours()<17?"Afternoon":"Evening";

  const alertHtml=overdue.length?`<div class="alert-strip">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
    <div><strong>${overdue.length} overdue follow-up${overdue.length>1?"s":""}:</strong> ${overdue.map(c=>`<span class="ov-name" onclick="go('clients')">${c.company||c.clientName||"?"}</span> <span class="ov-date">${fd(c.followDate||c.followUpDate)}</span>`).join(" &bull; ")}</div>
  </div>`:"";

  const tbl=(items,cols,empty,rowFn)=>items.length?`<table class="mini-tbl"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${items.map(rowFn).join("")}</tbody></table>`:`<div class="card-empty">${empty}</div>`;

  const sc=STAGE_ORDER.map(s=>myC.filter(c=>(c.recordType||"")===s).length);
  const mx=Math.max(...sc,1);
  const pipeHtml=`<div class="dash-card" style="margin-bottom:14px">
    <div class="dc-hdr"><h3>Pipeline</h3></div>
    <div style="padding:12px 18px 16px">
      <div class="pipe-bars">${STAGE_ORDER.map((s,i)=>`<div class="pipe-col"><div class="pipe-bar" style="height:${Math.max(6,(sc[i]/mx)*60)}px" title="${s}: ${sc[i]}"></div><div class="pipe-lbl">${PIPE_SHORT[s]||s}<br><b>${sc[i]}</b></div></div>`).join("")}</div>
    </div></div>`;

  v.innerHTML=`<div class="dash-pg">
  <div class="pg-hdr"><h2>Good ${gr}, ${admin?"Admin":rep||"User"}</h2><span class="pg-sub">${today.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</span></div>
  ${alertHtml}
  <div class="kpi-row">
    <div class="kpi-tile"><div class="kt-i"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg></div><div class="kt-body"><div class="kt-val">${openDeals.length}</div><div class="kt-lbl">Open Deals</div></div></div>
    <div class="kpi-tile"><div class="kt-i" style="background:rgba(122,182,63,.15);color:#7ab63f"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1v22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div><div class="kt-body"><div class="kt-val" style="font-size:17px">${fmt(revenue)}</div><div class="kt-lbl">Collected Revenue</div></div></div>
    <div class="kpi-tile"><div class="kt-i" style="background:rgba(33,150,243,.12);color:#2196f3"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg></div><div class="kt-body"><div class="kt-val">${todayCalls.length}</div><div class="kt-lbl">Calls Today</div></div></div>
    <div class="kpi-tile${overdue.length?" kpi-urgent":""}"><div class="kt-i" style="background:rgba(229,72,77,.1);color:#e5484d"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div><div class="kt-body"><div class="kt-val">${myC.length}</div><div class="kt-lbl">Total Clients</div></div></div>
  </div>
  ${pipeHtml}
  <div class="dash-grid">
    <div class="dash-card"><div class="dc-hdr"><h3>Open Deals</h3><span class="dc-link" onclick="go('deals')">View all</span></div>
      ${tbl(openTasks,["Deal","Stage","Value"],"No open deals",d=>`<tr><td>${d.clientName||d.company||"—"}</td><td><span class="pill ${d.stage==="Negotiation"?"amber":"gray"}">${d.stage||d.dealStage||"—"}</span></td><td>PKR ${Number((d.qty||0)*(d.unitPrice||0)).toLocaleString()}</td></tr>`)}</div>
    <div class="dash-card"><div class="dc-hdr"><h3>Upcoming Meetings</h3><span class="dc-link" onclick="go('meetings')">View all</span></div>
      ${tbl(upcoming,["Client","Date","Type"],"No upcoming meetings",m=>`<tr><td>${m.company||m.clientName||"—"}</td><td>${fd(m.date)}</td><td><span class="pill blue">${m.type||"Meeting"}</span></td></tr>`)}</div>
    <div class="dash-card"><div class="dc-hdr"><h3>Closing This Month</h3><span class="dc-link" onclick="go('deals')">View all</span></div>
      ${tbl(closing,["Client","Value","Stage"],"No deals closing this month",d=>`<tr><td>${d.company||d.clientName||"—"}</td><td>PKR ${Number((d.qty||0)*(d.unitPrice||0)).toLocaleString()}</td><td><span class="pill amber">${d.stage||"—"}</span></td></tr>`)}</div>
    <div class="dash-card"><div class="dc-hdr"><h3>Overdue Follow-Ups</h3><span class="dc-link" onclick="go('clients')">View all</span></div>
      ${tbl(overdue,["Client","Due Date","Status"],"No overdue follow-ups",c=>`<tr><td>${c.company||c.clientName||"—"}</td><td style="color:var(--danger)">${fd(c.followDate||c.followUpDate)}</td><td><span class="pill ${c.status==="Active"?"green":"gray"}">${c.status||"—"}</span></td></tr>`)}</div>
  </div></div>`;
};


(function(){
  const _start=typeof startApp==="function"?startApp:null;
  if(_start) window.startApp=function(){
    _start();
    const sbA=document.getElementById("sbAvatar");
    const sbW=document.getElementById("sbWho");
    const sbR=document.getElementById("sbRole");
    if(session){
      if(sbA) sbA.textContent=(session.username||"U")[0].toUpperCase();
      if(sbW) sbW.textContent=session.username||"";
      if(sbR) sbR.textContent=isAdmin()?"Master Admin":"Employee";
    }
    updateTbTitle();
  };

  const _go=typeof go==="function"?go:null;
  if(_go) window.go=function(r){
    _go(r); updateTbTitle();
  };

  function updateTbTitle(){
    const map={dashboard:"Home",analytics:"Analytics",clients:"Leads & Clients",
      calls:"Call Log",meetings:"Meetings",deals:"Sales Tracker",performance:"Reports",admin:"Admin"};
    const el=document.getElementById("tbTitle");
    const cur=typeof route!=="undefined"?route:"dashboard";
    if(el) el.textContent=map[cur]||"Home";
  }

  const _rc=typeof renderConn==="function"?renderConn:null;
  if(_rc) window.renderConn=function(){
    _rc();
    const on=typeof supabase!=="undefined"&&supabase!==null&&(typeof cloudOK==="undefined"||cloudOK);
    ["connDot2","sbConnDot"].forEach(id=>{const el=document.getElementById(id);if(el)el.className="cdot"+(on?"":".off");});
    ["connTxt2","sbConnTxt"].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=on?"Cloud Sync":"Offline";});
  };

  window.logoutApp=function(){
    if(typeof logout==="function")logout();
    else{document.getElementById("app").classList.add("hidden");document.getElementById("login").classList.remove("hidden");}
  };
  window.sbSearch=function(q){
    q=q.toLowerCase();
    document.querySelectorAll("#sidebar .sb-item").forEach(b=>{
      const t=b.querySelector("span")?.textContent?.toLowerCase()||"";
      b.style.display=(!q||t.includes(q))?"":"none";
    });
  };
})();

</script>
